<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Solver · Merchant RPG Simulator</title>
  <meta name="description" content="Find the smallest Merchant parties that beat a quest enemy or a map run: heroes, rows, rotations and scrolls (a spoiler).">
  <script src="theme.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/solver.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Merchant RPG Simulator</a>
    <a class="gh" href="https://github.com/titaniteChuck/merchant-rpg-simulator" title="Source code on GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a>
  </header>

  <main>
    <h1 class="visually-hidden">Battle solver</h1>
    <label id="drop" class="drop drop-btn">
      <input id="file" type="file" accept=".txt,application/json,text/plain">
      <span class="drop-title">📂 Choose save file</span>
    </label>
    <div id="loaded" aria-live="polite"></div>

    <div id="setup" class="b3-steps" hidden>
      <!-- U42: the spoiler guard first; then one full-width Solve panel (the opponent's pickers, the options, the time
           budget, Solve and its progress); the results under it only once a solve is done. -->
      <section id="search-panel"></section>

      <section id="solve-box" class="run-box solve-box" aria-label="Solve">
        <div class="opp-row">
          <div class="seg compact" id="opp-switch" role="radiogroup" aria-label="Opponent">
            <label class="seg-opt"><input type="radio" name="opp" value="quest" checked><span>⚔️ Quest</span></label>
            <label class="seg-opt"><input type="radio" name="opp" value="map"><span>🗺️ Map</span></label>
          </div>
          <div id="target"></div>
        </div>
        <div id="search-form"></div>
      </section>

      <section id="search-results" class="b3-results solve-results" aria-live="polite" hidden></section>

      <!-- U41: no party panel until a result's Show. -->
      <section id="party-box" hidden>
        <div class="party-box-head">
          <h2 id="setup-title">Party and flow</h2>
          <button id="open-sim" type="button" class="secondary" title="Copy this party, its rotations and the opponent to the Simulator (it replaces the Simulator's party for this save), then open it">▶ Open in Simulator</button>
        </div>
        <!-- R2 F36: what the shown party is (and its rule) in the "?" beside the tabs (#party-help), no inner "Party" heading. -->
        <div class="b3-tab-row">
          <div class="tabs b3-tabs" role="tablist" aria-label="Views">
            <button id="tab-party" type="button" role="tab" aria-selected="true" aria-controls="setup-grid" data-tab="party">Party</button>
            <!-- U58: Flow layouts to compare (web/src/ui/flow-layouts.ts), one panel; U63: Flow 1 removed, the labels kept. -->
            <button id="tab-flow2" type="button" role="tab" aria-selected="false" aria-controls="flow-panel" data-tab="flow2" tabindex="-1">Flow 2</button>
            <button id="tab-flow3" type="button" role="tab" aria-selected="false" aria-controls="flow-panel" data-tab="flow3" tabindex="-1">Flow 3</button>
          </div>
          <!-- U51: one "?" beside the tabs, the open tab's (battle-page.ts showTab). -->
          <span id="party-help"></span><span id="plan-help" hidden></span>
        </div>
        <!-- R2 F28: no heading repeating the tab: the opponent line first; what the flow shows is in the tab row's "?" (U51). -->
        <div id="flow-panel" class="flow-panel" role="tabpanel" aria-labelledby="tab-flow2" hidden>
          <div class="flow-head"><div id="flow-opp" class="flow-opp"></div></div>
          <div id="plan"></div>
        </div>
        <div id="setup-grid" class="setup-grid b3-grid" role="tabpanel" aria-labelledby="tab-party">
          <!-- U65: the chart on top, full width (battle-page.ts hpBox); its selected turn is what the cards show. -->
          <div id="hp-col" class="hp-col"></div>
          <div id="party-col" class="party-col">
            <div id="party"></div>
          </div>
          <!-- U42: the opponent card (its pickers are in the Solve panel). U65: one enemy. -->
          <div id="opp-col" class="opp-col">
            <h3 class="col-title">👹 Opponent</h3>
            <div id="target-card"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>Fights use a TypeScript re-implementation of the game's combat rules, checked action by action against the game's own code.
      Fan project, not affiliated with the developers of Merchant.</p>
  </footer>
</body>
</html>
