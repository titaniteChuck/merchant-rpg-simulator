<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Battle Simulator · Merchant RPG Simulator</title>
  <meta name="description" content="Simulate quest fights and map runs for your Merchant party with the game's own combat rules.">
  <script src="theme.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
  <script type="module" src="js/battle.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./">Merchant RPG Simulator</a>
    <a class="gh" href="https://github.com/titaniteChuck/merchant-rpg-simulator" title="Source code on GitHub"><svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg><span>GitHub</span></a>
  </header>

  <main>
    <h1 class="visually-hidden">Battle simulator</h1>
    <label id="drop" class="drop drop-btn">
      <input id="file" type="file" accept=".txt,application/json,text/plain">
      <span class="drop-title">📂 Choose save file</span>
    </label>
    <div id="loaded" aria-live="polite"></div>

    <div id="setup" class="b3-steps" hidden>
      <!-- U48: no section titles on screen (headings for screen readers only). U70: no Simulate button, runs count or
           result tiles: every change runs the fights (battle-page.ts renderPlan); the four figures sit between this
           panel and the party (#sim-stats, sticky). -->
      <section>
        <h2 class="visually-hidden">Simulate</h2>
        <div class="run-box" role="group" aria-label="Simulate">
          <!-- U65: the opponent is chosen here; its card shows one enemy beside the party. U72: three rows (this
               toggle, the enemy or map, its modifiers: quest size, or a catalog map's ascension, grade, prefix and
               suffix); no scrolls, no map facts, no Clear all and no "?"s. -->
          <div class="opp-row">
            <div class="seg compact" id="opp-switch" role="radiogroup" aria-label="Opponent">
              <label class="seg-opt"><input type="radio" name="opp" value="quest" checked><span>⚔️ Quest enemy</span></label>
              <label class="seg-opt"><input type="radio" name="opp" value="map"><span>🗺️ Map run</span></label>
            </div>
            <div id="target"></div>
          </div>
        </div>
      </section>

      <!-- U70: win rate, grade when won, heroes dead, life left over the runs; one row at every width, sticky. -->
      <div id="sim-stats" class="sim-stats" role="group" aria-label="Results" aria-busy="false"></div>

      <section>
        <h2 id="setup-title" class="visually-hidden">Party and opponent</h2>
        <!-- U70: the Party view is the only view (Flow 2, Flow 3 and the tabs gone). -->
        <div id="setup-grid" class="setup-grid b3-grid">
          <!-- U65: the chart on top, full width (battle-page.ts hpBox); its selected turn is what the cards show. -->
          <div id="hp-col" class="hp-col"></div>
          <div id="party-col" class="party-col">
            <div id="party"></div>
          </div>
          <!-- U65: one enemy, no picker (the opponent is chosen in the Simulate panel). U72: no "Opponent" title. -->
          <div id="opp-col" class="opp-col" role="group" aria-label="Opponent">
            <div id="target-card"></div>
          </div>
        </div>
      </section>
    </div>
  </main>

  <footer>
    <p>Fights use a TypeScript re-implementation of the game's combat rules, checked action by action against the game's own code.
      Fan project, not affiliated with the developers of Merchant.</p>
  </footer>
</body>
</html>
