name: Deploy website

on:
  push:
    branches: [main]
    paths: ["site/**", "tools/**", "inventory/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble site
        run: |
          mkdir -p _site/data _site/py
          cp -r site/. _site/
          # Game data exported by tools/export_inventory.py, read by the pages.
          cp inventory/inventory.json inventory/gamedata.json _site/data/
          # Python tools, so pages can run them in the browser (Pyodide).
          cp tools/*.py _site/py/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
